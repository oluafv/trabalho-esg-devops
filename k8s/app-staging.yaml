apiVersion: v1
kind: ConfigMap
metadata:
  name: esg-config-staging
  namespace: fiap-esg-staging
data:
  DB_URL: "jdbc:oracle:thin:@oracle-service.fiap-esg-prod.svc.cluster.local:1521/xepdb1"
  SPRING_PROFILES_ACTIVE: "staging"
---
apiVersion: v1
kind: Secret
metadata:
  name: esg-secrets-staging
  namespace: fiap-esg-staging
type: Opaque
stringData:
  DB_USERNAME: "SYSTEM"
  DB_PASSWORD: "slender666"
  JWT_SECRET: "staging_jwt_secret_key_fiap_esg_2026"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fiap-esg-app-staging
  namespace: fiap-esg-staging
  labels:
    app: fiap-esg-app
    env: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fiap-esg-app
  template:
    metadata:
      labels:
        app: fiap-esg-app
        env: staging
    spec:
      containers:
        - name: esg-app
          image: ghcr.io/seu-usuario/trabalho_microsservicos:staging
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: esg-config-staging
                  key: DB_URL
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: esg-config-staging
                  key: SPRING_PROFILES_ACTIVE
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: esg-secrets-staging
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: esg-secrets-staging
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: esg-secrets-staging
                  key: JWT_SECRET
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1024Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: fiap-esg-service-staging
  namespace: fiap-esg-staging
spec:
  type: NodePort
  selector:
    app: fiap-esg-app
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30081
