spring.application.name=trabalho_microsservicos-test

# Configuração de H2 em memória para testes automatizados rápidos e isolados (CI/CD)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=Oracle;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Flyway desabilitado durante execução de testes unitários/integrados do CI
spring.flyway.enabled=false

minha.palavra.secreta=test-secret-key-super-secure-for-ci-cd-fiap-esg
