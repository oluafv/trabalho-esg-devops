spring.application.name=trabalho_microsservicos

## Conexao com o banco de dados (parametrizada com variáveis de ambiente para Docker/Staging/Producao)
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1522/xepdb1}
spring.datasource.username=${DB_USERNAME:SYSTEM}
spring.datasource.password=${DB_PASSWORD:slender666}

# Oracle JDBC Driver
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

minha.palavra.secreta=${JWT_SECRET:${JWT.SECRET:fiap_esg_secret_key_2026}}

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0